# Pktgen Topology Configuration
# Maps logical port names to physical portlist expressions.
# Edit this file to match your hardware setup.
# All skills reference ports by logical name (e.g. $topology.tx_port).

pktgen:
  host: "10.99.80.222"
  port: 22022

trex:
  host: "10.99.80.222"
  port: 4501
  # TRex 客户端库源码根（服务器路径，操作员配置）；read_file/grep 只读范围
  # lib_dir: "/root/miniconda3/envs/trex311/lib/python3.11/site-packages"
  # 已知 L2 事实（实测）：目标位于网关之后，TRex 端口 0 无法直接 ARP 解析目标；
  # 生成脚本必须显式 Ether(dst=<网关 MAC>, src=<端口 MAC>)。
  dst_mac: "f4:e9:75:ee:51:69"   # 网关下一跳 MAC（destination MAC）
  src_mac: "58:a2:e1:6d:89:2c"   # TRex 端口 0 自身 MAC
  start_force: true              # c.start(..., force=True) 绕过 dest-MAC 显式校验

tx_port:
  portlist: "0"
  description: "TX port — traffic egress"

rx_port:
  portlist: "1"
  description: "RX port — traffic ingress"

monitor_port:
  portlist: "all"
  description: "Port(s) for statistics monitoring"

target_port:
  portlist: "all"
  description: "Port(s) for control operations (stop/reset)"

dst_mac:
  portlist: "f0:c4:78:4c:a5:55"
  description: "Destination MAC address for traffic generation"

# Add more ports as needed, e.g.:
#  secondary_tx:
#    portlist: "2"
#    description: "Secondary TX port"
#
#  all_test_ports:
#    portlist: "0-3"
#    description: "All test ports"
